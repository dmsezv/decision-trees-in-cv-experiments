[project]
name = "decision-trees-in-cv-experiments"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "hydra-core>=1.3.2",
    "hydra-optuna-sweeper>=1.1.2",
    "mlflow>=3.10.1",
    "optuna>=4.8.0",
    "pandas>=2.3.3",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "thop>=0.1.1.post2209072238",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "tqdm>=4.67.3",
]

[tool.ruff]
line-length = 110

extend-exclude = ["src/NODE"]

[tool.ruff.lint]
# E (pycodestyle), F (pyflakes), I (isort - сортировка импортов)
select = ["E", "F", "I"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
