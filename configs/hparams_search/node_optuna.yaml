# @package _global_

defaults:
  - override /hydra/sweeper: optuna

hydra:
  sweeper:
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
      n_startup_trials: 3
    direction: maximize
    study_name: node_integration_search
    n_trials: 10
    n_jobs: 1

    search_space:
      model.depth:
        type: categorical
        choices: [3, 4, 5, 6]

      model.num_layers:
        type: categorical
        choices: [1, 2, 3]

      model.layer_dim:
        type: categorical
        choices: [16, 32, 64]
